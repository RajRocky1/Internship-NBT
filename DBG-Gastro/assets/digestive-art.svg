<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" class="gastro-svg-art" aria-label="Gastroenterology and digestive health illustration">
    <defs>
        <!-- Soft Circular Health Glow -->
        <radialGradient id="healthGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#8CCB3F" stop-opacity="0.18"/>
            <stop offset="60%" stop-color="#0A5C67" stop-opacity="0.08"/>
            <stop offset="100%" stop-color="#0A5C67" stop-opacity="0"/>
        </radialGradient>

        <!-- Stomach Warm-to-Teal Gradient echoing DBG Logo -->
        <linearGradient id="stomachGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#F59E0B"/>
            <stop offset="35%" stop-color="#E76F51"/>
            <stop offset="75%" stop-color="#C0392B"/>
            <stop offset="100%" stop-color="#0A5C67"/>
        </linearGradient>

        <!-- Intestinal Motility Gradient -->
        <linearGradient id="colonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8CCB3F"/>
            <stop offset="50%" stop-color="#7CBF32"/>
            <stop offset="100%" stop-color="#0A5C67"/>
        </linearGradient>

        <!-- Glow Filter -->
        <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
    </defs>

    <!-- Outer Pulsing Ripple -->
    <circle cx="200" cy="200" r="180" fill="url(#healthGlow)" class="gastro-pulse-circle" />

    <!-- Circular Track Outline -->
    <circle cx="200" cy="200" r="150" fill="none" stroke="#E2ECEF" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6"/>

    <!-- Digestive Motility Flow Orbit Line -->
    <path d="M 200,60 A 140,140 0 1,1 199,60" fill="none" stroke="url(#colonGrad)" stroke-width="2.5" class="gastro-motility-flow" opacity="0.45"/>

    <!-- Esophagus -->
    <path d="M 185,70 L 185,125 Q 185,135 192,142" fill="none" stroke="#0A5C67" stroke-width="8" stroke-linecap="round"/>

    <!-- Anatomical Stomach Shape -->
    <!-- J-shaped stomach with smooth curves: fundus, greater curvature, pylorus -->
    <path d="M 192,142 
             C 185,130 160,132 150,150 
             C 138,172 142,205 162,222 
             C 180,238 215,232 225,215 
             C 232,203 230,192 218,188 
             C 202,183 195,192 182,188 
             C 170,184 172,165 186,155 
             Z" 
          fill="url(#stomachGrad)" 
          stroke="#FFFFFF" 
          stroke-width="2.5" 
          filter="url(#softGlow)"
          opacity="0.95"/>

    <!-- Gentle Internal Stomach Highlight Arc -->
    <path d="M 158,160 C 150,175 152,198 168,212" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

    <!-- Duodenum and Small Intestines (Loops in center-lower abdomen) -->
    <path d="M 218,188 
             C 235,188 245,205 240,225 
             C 235,245 210,250 195,250
             C 180,250 165,260 175,272
             C 185,284 215,278 220,290
             C 225,302 205,312 190,308
             C 175,304 170,292 160,296" 
          fill="none" 
          stroke="#8CCB3F" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          opacity="0.85"/>

    <!-- Large Intestine / Colon Frame (Ascending, Transverse, Descending) -->
    <path d="M 140,310 
             C 135,280 132,240 134,200 
             C 135,170 148,155 175,152
             M 225,152
             C 252,155 264,170 265,200
             C 266,240 265,275 255,305
             C 250,320 238,328 222,326
             C 210,324 205,335 204,345" 
          fill="none" 
          stroke="#7CBF32" 
          stroke-width="7" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          stroke-dasharray="16 4"
          opacity="0.75"/>

    <!-- Sparkle Stars from DBG Logo -->
    <!-- Sparkle 1: Gold Top Right -->
    <g class="gastro-sparkle sparkle-1" transform="translate(290, 95)">
        <path d="M 0,-14 Q 0,0 14,0 Q 0,0 0,14 Q 0,0 -14,0 Q 0,0 0,-14 Z" fill="#F59E0B"/>
    </g>

    <!-- Sparkle 2: Cyan Left -->
    <g class="gastro-sparkle sparkle-2" transform="translate(95, 175)">
        <path d="M 0,-11 Q 0,0 11,0 Q 0,0 0,11 Q 0,0 -11,0 Q 0,0 0,-11 Z" fill="#8CCB3F"/>
    </g>

    <!-- Sparkle 3: Emerald Bottom Right -->
    <g class="gastro-sparkle sparkle-3" transform="translate(295, 270)">
        <path d="M 0,-10 Q 0,0 10,0 Q 0,0 0,10 Q 0,0 -10,0 Q 0,0 0,-10 Z" fill="#7CBF32"/>
    </g>

    <!-- Small Sparkle Dots -->
    <circle cx="115" cy="110" r="3" fill="#F59E0B" opacity="0.8"/>
    <circle cx="280" cy="180" r="2.5" fill="#8CCB3F" opacity="0.7"/>
    <circle cx="120" cy="270" r="3" fill="#7CBF32" opacity="0.6"/>
</svg>

